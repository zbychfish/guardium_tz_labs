name: Deploy MkDocs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Display installed versions
        run: |
          python --version
          mkdocs --version
          python -m pip show mkdocs-material
          python -m pip show mkdocs-glightbox
          python -m pip show selectolax

      - name: Build documentation
        run: mkdocs build --clean --strict

      - name: Verify GLightbox output
        run: |
          test -f site/assets/javascripts/glightbox.min.js
          test -f site/assets/stylesheets/glightbox.min.css
          grep -R 'class="glightbox"' site --include="*.html" | head -n 5

      - name: Configure Git credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force