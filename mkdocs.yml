site_name: Guardium Notes Labs
site_description: Labs for TZ based Guardium Data Protection workshop

theme:
  name: material
  

  palette:
    scheme: slate
    primary: deep purple
    accent: amber
    
  palette:
    scheme: slate
    primary: deep purple
    accent: amber
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.tilde
  - pymdownx.superfences
  - attr_list
  - pymdownx.keys
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
- stylesheets/extra.css

nav:
  - Home: index.md
  - V14:
      - Access to Lab: v14/access.md
      - Appliance setup (lab 1): v14/appliance.md
      - GIM (lab 2): v14/gim.md
      - KTAP (lab 3): v14/ktap.md
      - ATAP (lab 4): v14/atap.md
      - EXIT (lab 5): v14/exit.md
      - UC 1.0 - logstash based (lab 6): v14/logstash.md
      - ETAP (lab 7): v14/etap.md
      - VA (lab 8): v14/va.md
      - WINSTAP (lab 9): v14/winstap.md
      - Oracle monitoring options (lab 10): v14/oracle.md
      - Policies and Reports basics (lab 11): v14/polrepbas.md
  
