site_name: Guardium Notes Labs
site_description: Labs for TZ based Guardium Data Protection workshop
site_url: https://zbychfish.github.io/guardium_tz_labs/

theme:
  name: material
  

  palette:
    # Palette toggle for dark mode (default)
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Przełącz na tryb jasny
    # Palette toggle for light mode
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Przełącz na tryb ciemny
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: 100%
      height: auto
      zoomable: true
      draggable: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.tilde
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - pymdownx.keys
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
- stylesheets/extra.css

nav:
  - Home: index.md
  - V14:
      - Access to Lab: v14/access.md
      - Appliance setup (lab 1): v14/appliance.md
      - GIM (lab 2): v14/gim.md
      - KTAP (lab 3): v14/ktap.md
      - ATAP (lab 4): v14/atap.md
      - EXIT (lab 5): v14/exit.md
      - UC 1.0 - logstash based (lab 6): v14/logstash.md
      - ETAP (lab 7): v14/etap.md
      - VA (lab 8): v14/va.md
      - WINSTAP (lab 9): v14/winstap.md
      - Oracle monitoring options (lab 10): v14/oracle.md
      - Policies and Reports basics (lab 11): v14/polrepbas.md
      - VA result sets processing (lab 12): v14/varesultset.md
      - LTR (lab 12): v14/ltr.md
      - Edge Gateway (lab 13): v14/edge.md
      - GenAI - MCP (lab 14): v14/genaimcp.md
  - V15 (under construction, use only with V15 release):
      - KTAP (lab 1): v15/ktap.md
      - ATAP (lab 2): v15/atap.md
      - EXIT (lab 3): v15/exit.md
      - UC 1.0 - logstash based (lab 4): v15/logstash.md
      - ETAP (lab 5): v15/etap.md
      - VA (lab 6): v15/va.md

      
  
